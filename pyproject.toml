[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiarch-onnx-cv-benchmark"
version = "0.1.0"
description = "Controlled 24-run CNN vs Transformer (YOLO, RT-DETR, D-FINE, RF-DETR) benchmark & unified pure-NumPy ONNX Runtime decoder"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
